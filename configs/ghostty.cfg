# Font and cell geometry
font-family = FiraCode Nerd Font
font-style = Retina
font-size = 12
font-thicken = true
adjust-cell-width = -5%
adjust-cell-height = 15%
adjust-box-thickness = 1

# Colors
background = #20252c
foreground = #e5e5e5
bold-color = #7bcb7b

palette = 0=#5c7e8c
palette = 1=#f77669
palette = 2=#c3e88d
palette = 3=#ffeb95
palette = 4=#82aaff
palette = 5=#c792ea
palette = 6=#80cbc4
palette = 7=#eeffff
palette = 8=#8a8a8a
palette = 9=#ff5370
palette = 10=#c3e88d
palette = 11=#ffcb6b
palette = 12=#82aaff
palette = 13=#c792ea
palette = 14=#80cbc4
palette = 15=#d0d0d0

# Cursor
cursor-color = #ecffff
cursor-style = block
cursor-style-blink = false

# Window
window-width = 98
window-height = 27
window-padding-x = 8
window-padding-y = 8,2
window-save-state = always
window-inherit-working-directory = true

# Mark tabs needing attention without sound or Dock alerts.
bell-features = title,no-system,no-audio,no-attention

# Shell integration and links
shell-integration-features = no-cursor,ssh-env
link-previews = osc8

# Clipboard
clipboard-trim-trailing-spaces = true
keybind = super+c=copy_to_clipboard:plain

# macOS appearance
macos-titlebar-proxy-icon = hidden
macos-icon = custom-style
macos-icon-frame = plastic
macos-icon-ghost-color = FFFFFF
macos-icon-screen-color = 000000
