font-family = FiraCode Nerd Font
font-style = Retina
font-size = 12
font-thicken = true
adjust-cell-width = -5%
adjust-cell-height = 15%
adjust-box-thickness = 1

background = #20252c
foreground = #e5e5e5
bold-color = #7bcb7b
cursor-color = #ecffff
cursor-style = block
cursor-style-blink = false
shell-integration-features = no-cursor,ssh-env

palette = 0=#5c7e8c
palette = 1=#f77669
palette = 2=#c3e88d
palette = 3=#ffeb95
palette = 4=#82aaff
palette = 5=#c792ea
palette = 6=#80cbc4
palette = 7=#eeffff
palette = 8=#8a8a8a
palette = 9=#ff5370
palette = 10=#c3e88d
palette = 11=#ffcb6b
palette = 12=#82aaff
palette = 13=#c792ea
palette = 14=#80cbc4
palette = 15=#d0d0d0

macos-titlebar-style = tabs
window-save-state = always
window-width = 98
window-height = 27
window-padding-x = 8
window-padding-y = 8,2
